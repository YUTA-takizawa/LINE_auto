<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>QuickMsg</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'> </text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --phone: #f472b6;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    overflow: hidden;
  }
  /* ===== ヘッダー ===== */
  .header {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    width: 100%;
    max-width: 360px;
  }
  .header h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .header .time {
    font-size: 52px;
    font-weight: 700;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .settings-btn {
    position: absolute;
    top: 0;
    right: 0;
    background: none;
    border: 1.5px solid #2d2d45;
    border-radius: 10px;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    padding: 6px 8px;
    line-height: 1;
    transition: color 0.2s, border-color 0.2s;
  }
  .settings-btn:hover, .settings-btn.active { color: var(--text); border-color: var(--muted); }
  .recipient-badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: #4ade80;
    background: rgba(74,222,128,0.1);
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .recipient-badge.none {
    color: var(--muted);
    background: rgba(100,116,139,0.08);
  }
  /* ===== グリッド ===== */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  .btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 32px 16px;
    border: none;
    border-radius: 22px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    border-radius: inherit;
    transition: background 0.1s;
  }
  .btn:active { transform: scale(0.91); filter: brightness(1.15); }
  .btn:active::after { background: rgba(255,255,255,0.08); }
  .btn .icon { font-size: 38px; line-height: 1; }
  .btn .label {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .btn-home {
    background: linear-gradient(145deg, #065f46, #059669);
    color: #d1fae5;
    box-shadow: 0 4px 20px rgba(74,222,128,0.18), 0 1px 4px rgba(0,0,0,0.3);
  }
  .btn-rice {
    background: linear-gradient(145deg, #9a3412, #ea580c);
    color: #fed7aa;
    box-shadow: 0 4px 20px rgba(251,146,60,0.18), 0 1px 4px rgba(0,0,0,0.3);
  }
  .btn-bath {
    background: linear-gradient(145deg, #1e3a5f, #2563eb);
    color: #bfdbfe;
    box-shadow: 0 4px 20px rgba(96,165,250,0.18), 0 1px 4px rgba(0,0,0,0.3);
  }
  .btn-phone {
    background: linear-gradient(145deg, #831843, #db2777);
    color: #fce7f3;
    box-shadow: 0 4px 20px rgba(244,114,182,0.18), 0 1px 4px rgba(0,0,0,0.3);
  }
  .btn-dryer {
    background: linear-gradient(145deg, #4c1d95, #7c3aed);
    color: #ede9fe;
    box-shadow: 0 4px 20px rgba(167,139,250,0.18), 0 1px 4px rgba(0,0,0,0.3);
  }
  .btn-train {
    background: linear-gradient(145deg, #1e3a5f, #0369a1);
    color: #e0f2fe;
    box-shadow: 0 4px 20px rgba(56,189,248,0.18), 0 1px 4px rgba(0,0,0,0.3);
  }
  /* ===== プレビュー ===== */
  .preview {
    margin-top: 20px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .preview .tag {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .preview .msg {
    font-size: 15px;
    color: var(--text);
    padding: 14px 20px;
    background: var(--surface);
    border-radius: 16px;
    border: 1.5px solid #2a2a40;
    width: 100%;
    text-align: center;
    line-height: 1.6;
    transition: opacity 0.15s, border-color 0.2s;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .preview .msg.tappable {
    border-color: #3d3d5c;
  }
  .preview .msg.tappable:active {
    opacity: 0.7;
  }
  .preview .hint {
    font-size: 11px;
    color: var(--muted);
    display: none;
  }
  .preview .hint.visible {
    display: block;
  }
  .send-line-btn {
    display: none;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.12s, filter 0.12s;
    box-shadow: 0 4px 20px rgba(6,182,212,0.25);
  }
  .send-line-btn.visible { display: block; }
  .send-line-btn:active { transform: scale(0.97); filter: brightness(1.1); }
  /* ===== フッター ===== */
  .footer {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    opacity: 0.7;
  }
  /* ===== トースト ===== */
  .sent-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: rgba(10,10,20,0.92);
    color: #fff;
    padding: 18px 30px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    text-align: center;
    line-height: 1.6;
    max-width: 280px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
  }
  .sent-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  /* ===== あと○分サブメニュー ===== */
  .phone-sub {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border-radius: 18px;
    padding: 18px 20px;
    border: 1px solid #2a2a40;
  }
  .phone-sub.active { display: flex; }
  .phone-sub .mins-row {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .phone-sub .mins-num {
    font-size: 36px;
    font-weight: 700;
    color: var(--phone);
    font-variant-numeric: tabular-nums;
    min-width: 52px;
    text-align: right;
  }
  .phone-sub .mins-unit {
    font-size: 16px;
    font-weight: 700;
    color: var(--phone);
    opacity: 0.8;
  }
  .phone-sub input[type=range] {
    width: 100%;
    accent-color: var(--phone);
    height: 6px;
    cursor: pointer;
  }
  .phone-sub .send-phone {
    background: linear-gradient(135deg, #831843, #db2777);
    color: #fce7f3;
    border: none;
    padding: 14px 0;
    width: 100%;
    border-radius: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s;
  }
  .phone-sub .send-phone:active { transform: scale(0.96); }
  /* ===== 設定モーダル ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1e1e30;
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 40px;
    animation: slideUp 0.28s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
    letter-spacing: 1px;
  }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .modal input[type=text] {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid #334155;
    border-radius: 12px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal input[type=text]:focus { border-color: #4ade80; }
  .modal .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.6;
  }
  .modal-btns {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .modal-btns button {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s;
  }
  .modal-btns button:active { transform: scale(0.96); }
  .btn-cancel {
    background: #2d2d45;
    color: var(--muted);
  }
  .btn-save {
    background: linear-gradient(135deg, #065f46, #059669);
    color: #d1fae5;
  }
</style>
</head>
<body>
<div class="header">
  <h1>QuickMsg</h1>
  <div class="time" id="clock">--:--</div>
  <div id="recipientBadge" class="recipient-badge none">送信先未設定</div>
  <button class="settings-btn" onclick="openSettings()" title="設定">⚙️</button>
</div>
<div class="grid">
  <button class="btn btn-home" onclick="selectCategory('home')">
    <span class="icon">🏠</span>
    <span class="label">帰宅</span>
  </button>
  <button class="btn btn-rice" onclick="selectCategory('rice')">
    <span class="icon">🍚</span>
    <span class="label">ご飯</span>
  </button>
  <button class="btn btn-bath" onclick="selectCategory('bath')">
    <span class="icon">🛁</span>
    <span class="label">お風呂</span>
  </button>
  <button class="btn btn-phone" onclick="togglePhone()">
    <span class="icon">⏱️</span>
    <span class="label">あと○分</span>
  </button>
  <button class="btn btn-dryer" onclick="selectCategory('dryer')">
    <span class="icon">💨</span>
    <span class="label">ドライヤー</span>
  </button>
  <button class="btn btn-train" onclick="selectCategory('train')">
    <span class="icon">🚃</span>
    <span class="label">電車</span>
  </button>
</div>
<div class="phone-sub" id="phoneSub">
  <div class="mins-row">
    <span class="mins-num" id="minsVal">10</span>
    <span class="mins-unit">分</span>
  </div>
  <input type="range" min="5" max="60" step="5" value="10" oninput="updateMins(this.value)">
  <button class="send-phone" onclick="confirmPhone()">この時間で送る</button>
</div>
<div class="preview">
  <div class="tag" id="previewTag">プレビュー</div>
  <div class="msg" id="previewMsg" onclick="cycleMsg()">ボタンを押してね</div>
  <div class="hint" id="previewHint">タップで別のメッセージに変更</div>
  <button class="send-line-btn" id="sendLineBtn" onclick="doSend()">LINEで送る</button>
</div>
<div class="footer">ボタン → メッセージ確認 → LINEで送る</div>
<div class="sent-toast" id="toast"></div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="closeOnOverlay(event)">
  <div class="modal">
    <h2>⚙️ 設定</h2>
    <label>送信先のLINE ID</label>
    <input type="text" id="lineIdInput" placeholder="例: taro_yamada" autocomplete="off" autocapitalize="none" spellcheck="false">
    <p class="hint">
      LINE ID は相手のプロフィール → ID の欄で確認できます。<br>
      設定するとクリップボードにコピーして直接チャットを開きます。<br>
      空欄にすると送信先選択画面に戻ります。
    </p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSettings()">キャンセル</button>
      <button class="btn-save" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== メッセージバリエーション =====
const messages = {
  home: [
    "今帰ったよ",
    "ただいま！やっと着いた",
    "帰ったよ、疲れた",
    "いま帰った！",
    "やっと家ついた",
    "ただいま、遅くなってごめん",
    "帰宅！おつかれさま",
    "いま着いたとこ！",
    "帰ってきたよ",
    "ただいま、遅くなった",
    "やっとついたわ",
    "いま帰り",
    "無事帰ったよ！",
    "帰宅〜、眠い",
    "家ついた、ほっとした",
    "いま玄関入ったとこ",
    "帰ってきた！ご飯食べた？",
    "お疲れ、帰ったよ",
  ],
  rice: [
    "ご飯食べてるよ",
    "いまご飯中！",
    "ちょっとご飯食べてくるね",
    "ご飯たべてる",
    "いまご飯たべてる！ちょっと待ってて",
    "ご飯中、食べたら連絡する",
    "ごはん食べてくる！",
    "いまからご飯",
    "ご飯食べてるから少し待ってね",
    "腹ごしらえ中",
    "飯食ってる！あとで連絡する",
    "ご飯中、もうちょいで食べ終わる",
    "ちょっと食べてくるね",
    "めし中！すぐ連絡する",
    "いまごはん！終わったら連絡するね",
    "ご飯タイム",
    "ちょうどご飯食べてたとこ",
    "食事中なのでちょっと待ってて",
  ],
  bath: [
    "お風呂入ってくるね",
    "ちょっとシャワー浴びてくる！",
    "お風呂いってくる",
    "風呂入ってくる！",
    "さっぱりしてくるわ",
    "お風呂入ってくる、出たら連絡する！",
    "シャワーしてくるね",
    "ちょっとお風呂タイム",
    "お風呂入ってくる、あとでね",
    "風呂いってきます！",
    "さくっとシャワーしてくる",
    "お風呂はいってくるね、すぐ出る！",
    "風呂タイム！出たらすぐ連絡する",
    "シャワー浴びてくる、ちょっと待ってて",
    "お風呂！終わったら連絡するね",
    "さっと風呂入ってくる",
    "シャワー中ね、すぐ出る！",
    "お風呂いってくる、待ってて",
  ],
  phone: [
    "あと{min}分くらいで電話できるよ！",
    "あと{min}分くらいで大丈夫！",
    "{min}分後くらいに電話するね",
    "あと{min}分待ってて！",
    "もうちょいで終わる！{min}分くらい",
    "{min}分後に電話するね",
    "あと{min}分くらいかな、待ってて",
    "もう少しで電話できる！あと{min}分",
    "{min}分くらいで電話する",
    "あと{min}分で落ち着くから待ってて！",
    "もう少し！{min}分くらいで電話する",
    "あとちょっと！{min}分待ってて",
    "{min}分後に絶対電話する！",
    "あと{min}分だけ待ってて〜！",
  ],
  dryer: [
    "ドライヤーかけてるから少し待ってて",
    "いまドライヤー中、終わったら連絡する",
    "ドライヤー中なので返信遅れる！",
    "髪乾かしてる、もうちょいで終わる",
    "ドライヤーしてるからちょっと待ってて",
    "いまドライヤーかけてる、すぐ終わる",
    "髪乾かし中！終わったら連絡するね",
    "ドライヤー中につき返信遅れます",
    "いまドライヤーしてる、待ってて",
    "ちょっとドライヤー中、すぐ終わる！",
  ],
  train: [
    "いま電車乗った！",
    "電車乗ったよ",
    "いまから電車、着いたら連絡する",
    "電車に乗ったとこ",
    "乗車した！着いたら連絡するね",
    "いま電車、しばらく揺れてる",
    "電車乗ったからもうすぐ着く",
    "電車に乗りました",
    "いま電車の中、着いたら連絡する！",
    "乗った！着いたら連絡するね",
    "電車乗ったよ、あと少しで着く",
    "いまから電車乗る！",
  ],
};

// ===== バイブレーション =====
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(40);
}

// ===== 重複防止 =====
const lastUsed = {};
function pickRandom(category, mins) {
  const pool = messages[category];
  let msg;
  let attempts = 0;
  do {
    msg = pool[Math.floor(Math.random() * pool.length)];
    attempts++;
  } while (msg === lastUsed[category] && attempts < 10);
  lastUsed[category] = msg;
  if (mins) msg = msg.replace(/{min}/g, mins);
  return msg;
}

// ===== 選択・サイクル・送信 =====
let currentCategory = null;
let currentMsg = '';

function selectCategory(cat) {
  vibrate();
  document.getElementById('phoneSub').classList.remove('active');
  phoneOpen = false;
  currentCategory = cat;
  currentMsg = pickRandom(cat);
  showSelected();
}

function cycleMsg() {
  if (!currentCategory) return;
  vibrate();
  if (currentCategory === 'phone') {
    const mins = document.getElementById('minsVal').textContent;
    currentMsg = pickRandom('phone', mins);
  } else {
    currentMsg = pickRandom(currentCategory);
  }
  showSelected();
}

function doSend() {
  if (!currentMsg) return;
  vibrate();
  openLINE(currentMsg);
}

function showSelected() {
  const el = document.getElementById('previewMsg');
  el.style.opacity = '0';
  setTimeout(() => {
    el.textContent = currentMsg;
    el.style.opacity = '1';
  }, 80);
  el.classList.add('tappable');
  document.getElementById('previewHint').classList.add('visible');
  document.getElementById('sendLineBtn').classList.add('visible');
}

// ===== 設定 =====
function getLineId() {
  return localStorage.getItem('lineId') || '';
}
function updateBadge() {
  const id = getLineId();
  const badge = document.getElementById('recipientBadge');
  if (id) {
    badge.textContent = `→ ${id}`;
    badge.className = 'recipient-badge';
  } else {
    badge.textContent = '送信先未設定';
    badge.className = 'recipient-badge none';
  }
}
function openSettings() {
  document.getElementById('lineIdInput').value = getLineId();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function saveSettings() {
  const val = document.getElementById('lineIdInput').value.trim();
  localStorage.setItem('lineId', val);
  updateBadge();
  closeSettings();
}
function closeOnOverlay(e) {
  if (e.target === document.getElementById('modalOverlay')) closeSettings();
}

// ===== LINE を開く =====
function openLINE(text) {
  const lineId = getLineId();
  if (lineId) {
    navigator.clipboard.writeText(text).catch(() => {});
    const toastEl = document.getElementById('toast');
    toastEl.innerHTML = '📋 コピーしました！<br><small>貼り付けて送信してね</small>';
    showToast();
    setTimeout(() => {
      window.location.href = `line://ti/p/${lineId}`;
    }, 600);
  } else {
    const toastEl = document.getElementById('toast');
    toastEl.textContent = 'LINEを開きます';
    showToast();
    setTimeout(() => {
      window.location.href = `line://msg/text/${encodeURIComponent(text)}`;
    }, 400);
  }
}

// ===== 電話ボタン =====
let phoneOpen = false;
function togglePhone() {
  vibrate();
  phoneOpen = !phoneOpen;
  document.getElementById('phoneSub').classList.toggle('active', phoneOpen);
  if (phoneOpen) {
    currentCategory = 'phone';
    const mins = document.getElementById('minsVal').textContent;
    currentMsg = pickRandom('phone', mins);
    showSelected();
  }
}
function updateMins(val) {
  document.getElementById('minsVal').textContent = val;
  if (currentCategory === 'phone') {
    currentMsg = pickRandom('phone', val);
    showSelected();
  }
}
function confirmPhone() {
  vibrate();
  const mins = document.getElementById('minsVal').textContent;
  currentCategory = 'phone';
  currentMsg = pickRandom('phone', mins);
  document.getElementById('phoneSub').classList.remove('active');
  phoneOpen = false;
  showSelected();
}
function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

// ===== 時計 =====
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 10000);

// ===== 初期化 =====
updateBadge();
</script>
